<!DOCTYPE html>
<html lang="it">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foutih Osama - Portfolio</title>
    <meta name="description" content="Portfolio di Foutih Osama – Sviluppatore Web Junior con competenze fullstack, progetti universitari e personali.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<body>

                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" data-route="home" id="nav-home">
                            <i class="bi bi-house-fill"></i> <span>Home</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-route="education" id="nav-education">
                            <i class="bi bi-mortarboard-fill"></i> <span>Formazione</span>

                    <li class="nav-item">

                    </li>

                            <i class="bi bi-folder-fill"></i> <span>Progetti</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-route="contacts" id="nav-contacts">
                            <i class="bi bi-envelope-fill"></i> <span>Contatti</span>
                        </a>

                </ul>

    <main id="app" class="container-fluid px-0 mt-5 pt-3"></main>

    <footer id="mainFooter">
        <div class="container text-center">
            <p class="mb-0 small">
                &copy; <span id="footer-year"></span> Foutih Osama. All rights reserved.
            </p>
        </div>
    </footer>
    <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/main.js"></script>
